[package]
name = "near-send"
version = "1.2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[features]
ohos-multiwindow-smoke = []

[dependencies]
gpui = { git = "https://github.com/ohos-rs/zed.git", rev = "59e51d0ff624b9c1de01236bc77bc6caf9efce42", version = "=0.2.2", default-features = false }
gpui-ohos = { git = "https://github.com/ohos-rs/gpui-ohos.git", rev = "a2f4062702825e8e607e0802d00d6d2393955cec" }
gpui-component = { git = "https://github.com/longbridge/gpui-component.git", rev = "2f2bab9a6cea994531527bd382bfdafc463b0d0b" }
gpui-router = { version = "0.3" }
gpui-kit-assets = { git = "https://github.com/longbridge/gpui-component.git", rev = "2f2bab9a6cea994531527bd382bfdafc463b0d0b" }
openharmony-ability = { git = "https://github.com/richerfu/openharmony-ability.git", rev = "f79612979165fe9ebf14f90db075540befcc67eb" }
openharmony-ability-derive = { git = "https://github.com/richerfu/openharmony-ability.git", rev = "f79612979165fe9ebf14f90db075540befcc67eb" }
openharmony-ability-plugin-files = { git = "https://github.com/richerfu/openharmony-ability.git", rev = "f79612979165fe9ebf14f90db075540befcc67eb" }
openharmony-ability-plugin-permission = { git = "https://github.com/richerfu/openharmony-ability.git", rev = "f79612979165fe9ebf14f90db075540befcc67eb" }

napi-ohos = { version = "=1.2.0" }
napi-derive-ohos = { version = "=1.2.0" }
napi-derive-backend-ohos = { version = "=1.2.0" }
ohos-hilog-binding = { version = "*", features = ["log"] }
log = { version = "*" }

# LocalSend protocol implementation - use official core from localsend/localsend
localsend = { git = "https://github.com/localsend/localsend.git", features = [
    "http",
], rev = "1a9b8280ff0a768caa1fab78647cc6b2aa849ef3" }
# localsend = { path = "../localsend/core", features = ["http"]}

# Network dependencies (still needed for some utilities)
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4"] }
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
] }
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "tokio", "http1"] }
http-body-util = "0.1"
bytes = "1"
base64 = "0.22"
sha2 = "0.10"
tokio-rustls = "0.26"
rustls = "0.23"
if-addrs = "0.13"
socket2 = "0.6"
qrcode = "0.14.1"
urlencoding = "2.1.3"
rust-embed = { version = "8.11.0", features = ["debug-embed"] }

[target.'cfg(target_env = "ohos")'.dependencies]
ohos-ability-access-control-binding = "0.0.1"
ohos-fileuri-binding = "0.1"
ohos-fileshare-binding = "0.1"

[build-dependencies]
napi-build-ohos = { version = "=1.2.0" }


# 强制 patch 所有来源的依赖，确保统一使用固定 revision 的 Zed 实现。
[patch.crates-io]
ohos-xcomponent-binding = { git = "https://github.com/ohos-rs/ohos-native-bindings.git", rev = "c05f75ebc489ad2a8c7f7b314aac38a27fb24836" }
ohos-xcomponent-sys = { git = "https://github.com/ohos-rs/ohos-native-bindings.git", rev = "c05f75ebc489ad2a8c7f7b314aac38a27fb24836" }
ohos-arkui-input-sys = { git = "https://github.com/ohos-rs/ohos-native-bindings.git", rev = "c05f75ebc489ad2a8c7f7b314aac38a27fb24836" }
ohos-arkui-input-binding = { git = "https://github.com/ohos-rs/ohos-native-bindings.git", rev = "c05f75ebc489ad2a8c7f7b314aac38a27fb24836" }
gpui = { git = "https://github.com/ohos-rs/zed.git", rev = "59e51d0ff624b9c1de01236bc77bc6caf9efce42", version = "=0.2.2" }
gpui_macros = { git = "https://github.com/ohos-rs/zed.git", rev = "59e51d0ff624b9c1de01236bc77bc6caf9efce42" }
gpui-pre = { path = "vendor/gpui-pre-adapters/gpui" }
gpui-pre-macros = { path = "vendor/gpui-pre-adapters/gpui-macros" }
gpui-pre-sum-tree = { path = "vendor/gpui-pre-adapters/sum-tree" }
# gpui-router 0.3.0 and its upstream HEAD require this RenderOnce
# disambiguation when built against the current GPUI main branch.
gpui-router = { path = "vendor/gpui-router" }

[patch."https://github.com/zed-industries/zed.git"]
gpui = { git = "https://github.com/ohos-rs/zed.git", rev = "59e51d0ff624b9c1de01236bc77bc6caf9efce42", version = "=0.2.2" }
gpui_macros = { git = "https://github.com/ohos-rs/zed.git", rev = "59e51d0ff624b9c1de01236bc77bc6caf9efce42" }

[patch."https://github.com/zed-industries/zed"]
gpui = { git = "https://github.com/ohos-rs/zed.git", rev = "59e51d0ff624b9c1de01236bc77bc6caf9efce42", version = "=0.2.2" }
gpui_macros = { git = "https://github.com/ohos-rs/zed.git", rev = "59e51d0ff624b9c1de01236bc77bc6caf9efce42" }

[patch."https://github.com/richerfu/zed.git"]
gpui = { git = "https://github.com/ohos-rs/zed.git", rev = "59e51d0ff624b9c1de01236bc77bc6caf9efce42", version = "=0.2.2" }
gpui_macros = { git = "https://github.com/ohos-rs/zed.git", rev = "59e51d0ff624b9c1de01236bc77bc6caf9efce42" }

[patch."https://github.com/richerfu/zed"]
gpui = { git = "https://github.com/ohos-rs/zed.git", rev = "59e51d0ff624b9c1de01236bc77bc6caf9efce42", version = "=0.2.2" }
gpui_macros = { git = "https://github.com/ohos-rs/zed.git", rev = "59e51d0ff624b9c1de01236bc77bc6caf9efce42" }
