[package]
name = "near-send"
version = "1.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
gpui = { git = "https://github.com/ohos-rs/zed.git", rev = "e1c455dc0d57cbd036ca2bd704c1c9ef4b8925a1", version = "=0.2.2" }
gpui_platform = { git = "https://github.com/ohos-rs/zed.git", rev = "e1c455dc0d57cbd036ca2bd704c1c9ef4b8925a1" }
gpui-component = { git = "https://github.com/longbridge/gpui-component.git", rev = "9890a77c2d427f05b2512f05ddc6cce84686f9a6" }
gpui-router = { version = "0.3" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component.git", rev = "9890a77c2d427f05b2512f05ddc6cce84686f9a6" }
openharmony-ability = { version = "1.0.0-beta.2" }
openharmony-ability-derive = { version = "1.0.0-beta.1" }
openharmony-ability-plugin-files = { version = "1.0.0-beta.1" }
openharmony-ability-plugin-permission = { version = "1.0.0-beta.1" }

napi-ohos = { version = "=1.2.0" }
napi-derive-ohos = { version = "=1.2.0" }
napi-derive-backend-ohos = { version = "=1.2.0" }
ohos-hilog-binding = { version = "*", features = ["log"] }
log = { version = "*" }

# LocalSend protocol implementation - use official core from localsend/localsend
localsend = { git = "https://github.com/localsend/localsend.git", features = [
    "http",
], rev = "1a9b8280ff0a768caa1fab78647cc6b2aa849ef3" }
# localsend = { path = "../localsend/core", features = ["http"]}

# Network dependencies (still needed for some utilities)
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4"] }
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
] }
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "tokio", "http1"] }
http-body-util = "0.1"
bytes = "1"
base64 = "0.22"
sha2 = "0.10"
tokio-rustls = "0.26"
rustls = "0.23"
if-addrs = "0.13"
socket2 = "0.6"
qrcode = "0.14.1"
urlencoding = "2.1.3"
rust-embed = { version = "8.11.0", features = ["debug-embed"] }

[target.'cfg(target_env = "ohos")'.dependencies]
ohos-ability-access-control-binding = "0.0.1"
ohos-fileuri-binding = "0.1"
ohos-fileshare-binding = "0.1"

[build-dependencies]
napi-build-ohos = { version = "=1.2.0" }


# 强制 patch 所有来源的依赖，确保统一使用 fork 中固定 revision 的 OHOS 实现
[patch.crates-io]
gpui = { git = "https://github.com/ohos-rs/zed.git", rev = "e1c455dc0d57cbd036ca2bd704c1c9ef4b8925a1", version = "=0.2.2" }
gpui_platform = { git = "https://github.com/ohos-rs/zed.git", rev = "e1c455dc0d57cbd036ca2bd704c1c9ef4b8925a1" }
gpui_macros = { git = "https://github.com/ohos-rs/zed.git", rev = "e1c455dc0d57cbd036ca2bd704c1c9ef4b8925a1" }
# gpui-router 0.3.0 and its upstream HEAD require this RenderOnce
# disambiguation when built against the current GPUI main branch.
gpui-router = { path = "vendor/gpui-router" }

[patch."https://github.com/zed-industries/zed.git"]
gpui = { git = "https://github.com/ohos-rs/zed.git", rev = "e1c455dc0d57cbd036ca2bd704c1c9ef4b8925a1", version = "=0.2.2" }
gpui_platform = { git = "https://github.com/ohos-rs/zed.git", rev = "e1c455dc0d57cbd036ca2bd704c1c9ef4b8925a1" }
gpui_macros = { git = "https://github.com/ohos-rs/zed.git", rev = "e1c455dc0d57cbd036ca2bd704c1c9ef4b8925a1" }

