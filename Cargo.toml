[package]
name = "near-send"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
gpui = { path = "../zed/crates/gpui" }
gpui_platform = { path = "../zed/crates/gpui_platform" }
gpui-component = { git = "https://github.com/longbridge/gpui-component.git", rev = "bd28642309b823b2b1f66973a0dbc714d9e7d91c" }
gpui-router = { version = "0.3" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component.git", rev = "bd28642309b823b2b1f66973a0dbc714d9e7d91c" }
openharmony-ability = { git = "https://github.com/harmony-contrib/openharmony-ability.git", rev = "e089f5f5e99903d2ad063dc0d535f39f06a1baa5" }
openharmony-ability-derive = { git = "https://github.com/harmony-contrib/openharmony-ability.git", rev = "e089f5f5e99903d2ad063dc0d535f39f06a1baa5" }
openharmony-ability-plugin-permission = { git = "https://github.com/harmony-contrib/openharmony-ability.git", rev = "e089f5f5e99903d2ad063dc0d535f39f06a1baa5" }

napi-ohos = { version = "=1.2.0" }
napi-derive-ohos = { version = "=1.2.0" }
napi-derive-backend-ohos = { version = "=1.2.0" }
ohos-hilog-binding = { version = "*", features = ["log"] }
log = { version = "*" }

# LocalSend protocol implementation - use official core from localsend/localsend
localsend = { git = "https://github.com/localsend/localsend.git", features = [
    "http",
], rev = "1a9b8280ff0a768caa1fab78647cc6b2aa849ef3" }
# localsend = { path = "../localsend/core", features = ["http"]}

# Network dependencies (still needed for some utilities)
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4"] }
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
] }
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "tokio", "http1"] }
http-body-util = "0.1"
bytes = "1"
base64 = "0.22"
sha2 = "0.10"
tokio-rustls = "0.26"
rustls = "0.23"
if-addrs = "0.13"
socket2 = "0.6"
qrcode = "0.14.1"
urlencoding = "2.1.3"
rust-embed = { version = "8.11.0", features = ["debug-embed"] }

[target.'cfg(target_env = "ohos")'.dependencies]
ohos-ability-access-control-binding = "0.0.1"
ohos-fileuri-binding = "0.1"
ohos-fileshare-binding = "0.1"

[build-dependencies]
napi-build-ohos = { version = "=1.2.0" }


# 强制 patch 所有来源的依赖，确保统一使用相邻工作区的 OHOS 实现
[patch.crates-io]
gpui = { path = "../zed/crates/gpui" }
gpui_platform = { path = "../zed/crates/gpui_platform" }
gpui_macros = { path = "../zed/crates/gpui_macros" }

[patch."https://github.com/zed-industries/zed.git"]
gpui = { path = "../zed/crates/gpui" }
gpui_platform = { path = "../zed/crates/gpui_platform" }
gpui_macros = { path = "../zed/crates/gpui_macros" }

[patch."https://github.com/zed-industries/zed"]
gpui = { path = "../zed/crates/gpui" }
gpui_platform = { path = "../zed/crates/gpui_platform" }
gpui_macros = { path = "../zed/crates/gpui_macros" }
