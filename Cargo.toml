[package]
name = "near-send"
version = "1.3.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[features]
fps = ["dep:gpui-fps"]

# Keep device debug builds responsive without changing rendered output.
# NearSend retains debug info, assertions, and overflow checks, while rendering,
# layout, text, and GPU dependencies use optimized machine code.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11", default-features = false }
gpui-ohos = "=0.0.1-beta.0"
# Use GPUI Kit's component/assets crates directly: its desktop facade selects
# Linux's platform backend on OHOS, where gpui-ohos supplies the platform.
gpui-component = "=0.9.0"
gpui-router = { version = "0.7.0", default-features = false, features = ["gpui-pre"] }
gpui-kit-assets = "=0.9.0"
gpui-fps = { version = "=0.9.0", optional = true }
# Match gpui-ohos's published ability crates and the ArkTS packages.
openharmony-ability = "=1.0.0-beta.5"
openharmony-ability-derive = "=1.0.0-beta.5"
openharmony-ability-plugin-files = "=1.0.0-beta.5"
openharmony-ability-plugin-permission = "=1.0.0-beta.5"

napi-ohos = { version = "=1.2.0" }
napi-derive-ohos = { version = "=1.2.0" }
napi-derive-backend-ohos = { version = "=1.2.0" }
ohos-hilog-binding = { version = "*", features = ["log"] }
log = { version = "*", features = ["release_max_level_info"] }

# LocalSend protocol implementation - use official core from localsend/localsend
localsend = { git = "https://github.com/localsend/localsend.git", features = [
    "http",
], rev = "1a9b8280ff0a768caa1fab78647cc6b2aa849ef3" }
# localsend = { path = "../localsend/core", features = ["http"]}

# Network dependencies (still needed for some utilities)
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4"] }
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
] }
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "tokio", "http1"] }
http-body-util = "0.1"
bytes = "1"
base64 = "0.22"
sha2 = "0.10"
tokio-rustls = "0.26"
rustls = "0.23"
if-addrs = "0.13"
socket2 = "0.6"
qrcode = "0.14.1"
urlencoding = "2.1.3"
rust-embed = { version = "8.11.0", features = ["debug-embed"] }
rustc-hash = "2"
tempfile = "3"
thiserror = "2"

[target.'cfg(target_env = "ohos")'.dependencies]
ohos-ability-access-control-binding = "0.0.1"
ohos-fileuri-binding = "0.1"
ohos-fileshare-binding = "0.1"

[build-dependencies]
napi-build-ohos = { version = "=1.2.0" }
